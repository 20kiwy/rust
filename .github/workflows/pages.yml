name: Build & Deploy (pure Rust → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk + wasm-bindgen-cli (prebuilt binaries)
        run: |
          cd /tmp
          curl -sL -o trunk.tgz https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tgz
          install -m 755 trunk "$HOME/.cargo/bin/trunk"
          WB=0.2.129
          curl -sL -o wb.tgz "https://github.com/rustwasm/wasm-bindgen/releases/download/${WB}/wasm-bindgen-${WB}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf wb.tgz
          install -m 755 "wasm-bindgen-${WB}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          trunk --version
          wasm-bindgen --version

      - name: Build (trunk → dist)
        run: trunk build --release --public-url /rust/

      - name: Sanity check export
        run: |
          test -f dist/index.html
          ls dist/*_bg.wasm
          du -sh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
